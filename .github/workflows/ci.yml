name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -e -o pipefail: any failing command fails the step.
    shell: bash

jobs:
  build-and-test:
    name: build + tests (${{ matrix.build_type }}, LLVM ${{ matrix.llvm }}, ${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest LLVM we test against, compiler built with GCC. Debug build:
          # the compiler is ASan-instrumented, and the suite also fails if
          # the compiler leaks (TSPP_LEAK_CHECK=1).
          - llvm: 18
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Debug
            build_flags: ""
            build_dir: build
            leak_check: 1
          # Current apt.llvm.org stable, compiler built with that clang.
          - llvm: 22
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: Debug
            build_flags: ""
            build_dir: build
            leak_check: 1
          # Release build (optimized, no sanitizers), as users would build it.
          - llvm: 22
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: Release
            build_flags: --release
            build_dir: build-release
            leak_check: 0

    env:
      LLVM_VERSION: ${{ matrix.llvm }}
      # Compiler under test, used by tests/run.sh.
      TSPP: ${{ matrix.build_dir }}/src/tspp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ca-certificates wget lsb-release \
            libgc-dev libcurl4-openssl-dev

          # apt.llvm.org with a dedicated keyring (no apt-key).
          codename="$(lsb_release -cs)"
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          # libclang-rt-N-dev: ASan runtime, needed for `tspp --asan`
          # (exercised by tests/driver/cli.sh).
          sudo apt-get install -y --no-install-recommends \
            "llvm-${LLVM_VERSION}" "llvm-${LLVM_VERSION}-dev" \
            "clang-${LLVM_VERSION}" "libclang-rt-${LLVM_VERSION}-dev"

      - name: Select LLVM ${{ matrix.llvm }} toolchain
        run: |
          # The tspp driver looks up `clang` and `llvm-as` on PATH first; put the
          # chosen toolchain first on PATH so they resolve to LLVM N, not the
          # runner's preinstalled default.
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
          {
            # find_package(LLVM CONFIG) picks this prefix.
            echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-${LLVM_VERSION}"
            echo "CC=${{ matrix.cc }}"
            echo "CXX=${{ matrix.cxx }}"
          } >> "$GITHUB_ENV"
          # ASan (on by default in Debug builds) can crash at startup with the
          # high mmap ASLR entropy some runner kernels use.
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Show toolchain
        run: |
          cmake --version | head -n 1
          "$CC" --version | head -n 1
          "$CXX" --version | head -n 1
          command -v clang llvm-as
          clang --version | head -n 1
          llvm-as --version | head -n 2
          llvm-config --version

      - name: Build (${{ matrix.build_type }})
        # Debug -> build/, --release -> build-release/
        run: ./build.sh ${{ matrix.build_flags }}

      - name: Check tspp --version
        run: |
          "$TSPP" --version | grep -E '^tspp [0-9]+\.[0-9]+\.[0-9]+$'

      - name: Test
        # tests/run.sh uses $TSPP (which finds libcore.a next to itself), runs
        # the golden tests and the driver tests in tests/driver/ (shell
        # injection, run from another directory, link failure, CLI), and sets ASAN_OPTIONS/LSAN_OPTIONS itself. Exits
        # non-zero on any FAIL or XPASS (and, with TSPP_LEAK_CHECK=1, on any
        # LeakSanitizer report from the compiler).
        env:
          TSPP_LEAK_CHECK: ${{ matrix.leak_check }}
        run: tests/run.sh
