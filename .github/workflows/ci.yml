name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -e -o pipefail: any failing command fails the step.
    shell: bash

jobs:
  build-and-test:
    name: build + tests (LLVM ${{ matrix.llvm }}, ${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest LLVM we test against, compiler built with GCC.
          - llvm: 18
            compiler: gcc
            cc: gcc
            cxx: g++
          # Current apt.llvm.org stable, compiler built with that clang.
          - llvm: 22
            compiler: clang
            cc: clang
            cxx: clang++

    env:
      LLVM_VERSION: ${{ matrix.llvm }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ca-certificates wget lsb-release \
            libgc-dev libcurl4-openssl-dev

          # apt.llvm.org with a dedicated keyring (no apt-key).
          codename="$(lsb_release -cs)"
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          # libclang-rt-N-dev: ASan runtime, needed because the driver links
          # compiled programs with -fsanitize=address.
          sudo apt-get install -y --no-install-recommends \
            "llvm-${LLVM_VERSION}" "llvm-${LLVM_VERSION}-dev" \
            "clang-${LLVM_VERSION}" "libclang-rt-${LLVM_VERSION}-dev"

      - name: Select LLVM ${{ matrix.llvm }} toolchain
        run: |
          # The tspp driver runs unversioned `clang` and `llvm-as`; put the
          # chosen toolchain first on PATH so they resolve to LLVM N, not the
          # runner's preinstalled default.
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
          {
            # find_package(LLVM CONFIG) picks this prefix.
            echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-${LLVM_VERSION}"
            echo "CC=${{ matrix.cc }}"
            echo "CXX=${{ matrix.cxx }}"
          } >> "$GITHUB_ENV"
          # ASan (forced on in CMakeLists.txt) can crash at startup with the
          # high mmap ASLR entropy some runner kernels use.
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Show toolchain
        run: |
          cmake --version | head -n 1
          "$CC" --version | head -n 1
          "$CXX" --version | head -n 1
          command -v clang llvm-as
          clang --version | head -n 1
          llvm-as --version | head -n 2
          llvm-config --version

      - name: Build
        run: ./build.sh

      - name: Test
        # tests/run.sh uses ./build/src/tspp and ./build/src/libcore.a from
        # the checkout and sets ASAN_OPTIONS/LSAN_OPTIONS itself. Exits
        # non-zero on any FAIL or XPASS.
        run: tests/run.sh
